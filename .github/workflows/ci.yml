name: KEMGU CI

on:
  push:
    branches: [main, "feature/**", "claude/**", "konsolidasyon"]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Windows (MSYS2 UCRT64 + Clang64)
    runs-on: windows-latest
    # [D-558] PATH: is `msystem: UCRT64` kabugunda kosuyor ama `clang`
    # Clang64 alt-sisteminden geliyor (mingw-w64-clang-x86_64-clang) ve
    # /clang64/bin UCRT64 PATH'inde DEGIL. OLCULDU (CI logu):
    #   gcc.exe ... 16.2.0        <- OK
    #   clang: command not found  <- exit 127
    # CLAUDE.md zaten bunu sart kosuyor: clang64/bin ONCE gelmeli.
    env:
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 kur (UCRT64 + Clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            file

      - name: Derleyici kontrolu
        run: |
          export PATH=/clang64/bin:$PATH
          gcc --version | head -1
          clang --version | head -1
          mingw32-make --version | head -1

      - name: Derle (mingw32-make)
        id: w_derle
        run: |
          export PATH=/clang64/bin:$PATH
          mingw32-make

      - name: Tum testler (mingw32-make test_tumu)
        id: w_tumu
        run: |
          export PATH=/clang64/bin:$PATH
          mingw32-make test_tumu

      - name: Stdlib --check
        id: w_stdlib
        run: |
          export PATH=/clang64/bin:$PATH
          mingw32-make calistir_stdlib_check

      - name: Snapshot test
        id: w_snap
        run: |
          export PATH=/clang64/bin:$PATH
          mingw32-make calistir_snapshot_test

      - name: Fuzzer (10000 iter ASan)
        id: w_fuzz
        run: |
          export PATH=/clang64/bin:$PATH
          mingw32-make calistir_fuzz_test

      - name: Runtime link test
        id: w_rt
        run: |
          export PATH=/clang64/bin:$PATH
          mingw32-make calistir_runtime_link_test

      - name: Test sayisi ozeti
        if: always()
        # [D-667] OZET GERCEK ADIM SONUCLARINDAN KURULUR. Oncesinde sabit "OK"
        # metni basiliyordu ve `if: always()` ile ONCEKI ADIM DUSSE BILE
        # "test_tumu | OK" yaziyordu (dis inceleme buldu). Insanin okudugu
        # ozet adim sonucuna BAGLI DEGILDI — "rc=0 bir iddiadir" (D-486)
        # dersinin CI karsiligi. Atlanan adim "geçti" degil ATLANDI gorunur.
        env:
          S_DERLE: ${{ steps.w_derle.outcome }}
          S_TUMU: ${{ steps.w_tumu.outcome }}
          S_STDLIB: ${{ steps.w_stdlib.outcome }}
          S_SNAP: ${{ steps.w_snap.outcome }}
          S_FUZZ: ${{ steps.w_fuzz.outcome }}
          S_RT: ${{ steps.w_rt.outcome }}
        run: |
          d() { case "$1" in success) echo "OK";; failure) echo "BASARISIZ";; skipped) echo "ATLANDI";; cancelled) echo "IPTAL";; *) echo "BILINMIYOR ($1)";; esac; }
          {
            echo "## KEMGU Windows Test Sonuclari"
            echo ""
            echo "| Suite | Durum |"
            echo "|-------|-------|"
            echo "| Derleme | $(d "$S_DERLE") |"
            echo "| test_tumu | $(d "$S_TUMU") |"
            echo "| stdlib --check | $(d "$S_STDLIB") |"
            echo "| snapshot | $(d "$S_SNAP") |"
            echo "| fuzz (ASan) | $(d "$S_FUZZ") |"
            echo "| runtime link | $(d "$S_RT") |"
          } >> $GITHUB_STEP_SUMMARY

  build-linux:
    name: Linux (Ubuntu / clang + libasan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "apt: clang + gcc + make"
        run: |
          sudo apt-get update
          # [D-555] `llvm` ZORUNLU: test_llvm.c `opt -passes=verify` calistiriyor.
          # Yoksa 18 test 'IR reddedildi' diye DUSER — oysa eksik olan ARACTIR.
          # [D-556] `lld` ZORUNLU: bare-metal hedefleri `ld.lld` cagiriyor
          # (olculdu: calistir_uart_merhaba_bare_metal -> Error 127).
          sudo apt-get install -y clang gcc make file llvm lld
          ld.lld --version | head -1
          opt --version | head -2
          gcc --version | head -1
          clang --version | head -1

      - name: Derle (make)
        id: l_derle
        run: make

      - name: Tum testler (make test_tumu)
        id: l_tumu
        run: make test_tumu

      - name: Stdlib --check
        id: l_stdlib
        run: make calistir_stdlib_check

      - name: Snapshot test
        id: l_snap
        run: make calistir_snapshot_test

      - name: Fuzzer (10000 iter ASan + UBSan)
        id: l_fuzz
        run: make calistir_fuzz_test

      - name: Runtime link test
        id: l_rt
        run: make calistir_runtime_link_test

      - name: Linux test ozeti
        if: always()
        # [D-667] Windows ozetiyle ayni: sabit "gecti" metni yerine GERCEK sonuc.
        env:
          S_DERLE: ${{ steps.l_derle.outcome }}
          S_TUMU: ${{ steps.l_tumu.outcome }}
          S_STDLIB: ${{ steps.l_stdlib.outcome }}
          S_SNAP: ${{ steps.l_snap.outcome }}
          S_FUZZ: ${{ steps.l_fuzz.outcome }}
          S_RT: ${{ steps.l_rt.outcome }}
        run: |
          d() { case "$1" in success) echo "OK";; failure) echo "BASARISIZ";; skipped) echo "ATLANDI";; cancelled) echo "IPTAL";; *) echo "BILINMIYOR ($1)";; esac; }
          {
            echo "## KEMGU Linux Test Sonuclari"
            echo ""
            echo "| Suite | Durum |"
            echo "|-------|-------|"
            echo "| Derleme | $(d "$S_DERLE") |"
            echo "| test_tumu | $(d "$S_TUMU") |"
            echo "| stdlib --check | $(d "$S_STDLIB") |"
            echo "| snapshot | $(d "$S_SNAP") |"
            echo "| fuzz (ASan+UBSan) | $(d "$S_FUZZ") |"
            echo "| runtime link | $(d "$S_RT") |"
          } >> $GITHUB_STEP_SUMMARY
